<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painting AR — Ruysch Resurrection</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #video-pool {
      position: fixed;
      left: -1000px;
      top: -1000px;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      pointer-events: none;
    }
    #tap-start {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.92);
      color: #fff;
      text-align: center;
      padding: 24px;
      transition: opacity 0.4s ease;
    }
    #tap-start.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #tap-start .title { font-size: 22px; margin-bottom: 8px; letter-spacing: 0.5px; }
    #tap-start .sub { opacity: 0.7; margin-bottom: 28px; font-size: 14px; line-height: 1.5; max-width: 280px; }
    #tap-start .btn {
      padding: 16px 36px;
      background: #fff;
      color: #000;
      border-radius: 999px;
      font-weight: 600;
      font-size: 16px;
    }
    #scan-hud {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 9998;
      color: #fff;
      font-size: 13px;
      line-height: 1.4;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 12px;
      border-radius: 8px;
      pointer-events: none;
    }
    #scan-hud .status { font-weight: 600; }
    #scan-hud .detail { opacity: 0.75; font-size: 11px; margin-top: 2px; }
  </style>

  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  <script src="js/painting-resurrection.js"></script>
  <script async src="engine/xr.js" data-preload-chunks="slam"></script>

  <script>
    const onxrloaded = () => {
      XR8.XrController.configure({
        imageTargetData: [{
          name: 'painting',
          type: 'PLANAR',
          imagePath: 'assets/Targets/painting.png',
          properties: {
            left: 0, top: 0,
            width: 809, height: 1024,
            originalWidth: 809, originalHeight: 1024,
            isRotated: false
          }
        }]
      });
    };
    window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded);
  </script>
</head>
<body>
  <div id="video-pool" aria-hidden="true">
    <video id="video-flower-1" src="assets/video/flower-1.mp4" loop muted playsinline webkit-playsinline preload="auto"></video>
    <video id="video-flower-2" src="assets/video/flower-2.mp4" loop muted playsinline webkit-playsinline preload="auto"></video>
    <video id="video-flower-3" src="assets/video/flower-3.mp4" loop muted playsinline webkit-playsinline preload="auto"></video>
    <video id="video-flower-4" src="assets/video/flower-4.mp4" loop muted playsinline webkit-playsinline preload="auto"></video>
    <video id="video-flower-5" src="assets/video/flower-5.mp4" loop muted playsinline webkit-playsinline preload="auto"></video>
    <video id="video-flower-6" src="assets/video/flower-6.mp4" loop muted playsinline webkit-playsinline preload="auto"></video>
    <video id="video-flower-7" src="assets/video/flower-7.mp4" loop muted playsinline webkit-playsinline preload="auto"></video>
  </div>

  <div id="tap-start">
    <div>
      <div class="title">Ruysch Resurrection</div>
      <div class="sub">Tap to enable the AR experience, then point your camera at the printed painting.</div>
      <div class="btn">Tap to begin</div>
    </div>
  </div>

  <div id="scan-hud">
    <div class="status">Loading…</div>
    <div class="detail">Initializing</div>
  </div>

  <script>
    // Prime videos inside a real user gesture so iOS Safari decodes them.
    // Strategy: play all 7 at once and let them keep playing (offscreen pool).
    // Don't pause — iOS has issues resuming WebGL VideoTexture after pause.
    (function () {
      const overlay = document.getElementById('tap-start');
      const videos = Array.from(document.querySelectorAll('#video-pool video'));

      window.flowerVideoStats = {
        primed: 0,
        failed: 0,
        total: videos.length,
        errors: {},
      };

      const prime = () => {
        overlay.removeEventListener('click', prime);
        overlay.removeEventListener('touchend', prime);

        videos.forEach((v) => {
          v.muted = true;
          v.playsInline = true;
          v.loop = true;
          v.load();
          const attempt = v.play();
          if (attempt && attempt.then) {
            attempt.then(() => {
              window.flowerVideoStats.primed++;
              window.dispatchEvent(new CustomEvent('flower-video-primed', {
                detail: { id: v.id }
              }));
            }).catch((err) => {
              window.flowerVideoStats.failed++;
              window.flowerVideoStats.errors[v.id] = err && err.name;
              console.warn('[prime]', v.id, err && err.message);
            });
          } else {
            window.flowerVideoStats.primed++;
          }
        });

        overlay.classList.add('hidden');
        setTimeout(() => { overlay.style.display = 'none'; }, 500);
      };

      overlay.addEventListener('click', prime, { once: true });
      overlay.addEventListener('touchend', prime, { once: true });
    })();
  </script>

  <a-scene
    scan-hud
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    xrweb="disableWorldTracking: true">

    <a-camera position="0 4 10"></a-camera>

    <xrextras-named-image-target name="painting">
      <a-entity painting-resurrection="config: assets/meta/video-layers.json"></a-entity>
    </xrextras-named-image-target>

  </a-scene>
</body>
</html>
