<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painting AR — Ruysch Resurrection</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>

  <!-- AR Libraries -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  <script src="js/painting-resurrection.js"></script>

  <!-- 8th Wall Engine -->
  <script async src="engine/xr.js" data-preload-chunks="slam"></script>

  <!-- Image Target Configuration -->
  <script>
    const onxrloaded = () => {
      XR8.XrController.configure({
        imageTargetData: [{
          name: 'painting',
          type: 'PLANAR',
          imagePath: 'assets/Targets/painting.png',
          properties: {
            left: 0,
            top: 0,
            width: 809,
            height: 1024,
            originalWidth: 809,
            originalHeight: 1024,
            isRotated: false
          }
        }]
      });
    };
    window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded);
  </script>
</head>
<body>
  <div id="video-pool" aria-hidden="true" style="position:fixed;width:0;height:0;overflow:hidden;opacity:0;pointer-events:none">
    <video id="video-flower-1" src="assets/video/flower-1.mp4" crossorigin="anonymous" loop muted playsinline webkit-playsinline preload="auto"></video>
    <video id="video-flower-2" src="assets/video/flower-2.mp4" crossorigin="anonymous" loop muted playsinline webkit-playsinline preload="auto"></video>
    <video id="video-flower-3" src="assets/video/flower-3.mp4" crossorigin="anonymous" loop muted playsinline webkit-playsinline preload="auto"></video>
    <video id="video-flower-4" src="assets/video/flower-4.mp4" crossorigin="anonymous" loop muted playsinline webkit-playsinline preload="auto"></video>
    <video id="video-flower-5" src="assets/video/flower-5.mp4" crossorigin="anonymous" loop muted playsinline webkit-playsinline preload="auto"></video>
    <video id="video-flower-6" src="assets/video/flower-6.mp4" crossorigin="anonymous" loop muted playsinline webkit-playsinline preload="auto"></video>
    <video id="video-flower-7" src="assets/video/flower-7.mp4" crossorigin="anonymous" loop muted playsinline webkit-playsinline preload="auto"></video>
  </div>

  <a-scene
    scan-hud
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    xrweb="disableWorldTracking: true">

    <a-camera position="0 4 10"></a-camera>

    <xrextras-named-image-target name="painting">
      <a-entity painting-resurrection="config: assets/meta/video-layers.json"></a-entity>
    </xrextras-named-image-target>

  </a-scene>
</body>
</html>
