<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painting AR — Ruysch Resurrection</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>

  <!-- AR Libraries -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  <script src="js/painting-resurrection.js"></script>

  <!-- 8th Wall Engine -->
  <script async src="engine/xr.js" data-preload-chunks="slam"></script>

  <!-- Image Target Configuration -->
  <script>
    const onxrloaded = () => {
      XR8.XrController.configure({
        imageTargetData: [{
          name: 'painting',
          type: 'PLANAR',
          imagePath: 'assets/Targets/painting.png',
          properties: {
            left: 0,
            top: 0,
            width: 809,
            height: 1024,
            originalWidth: 809,
            originalHeight: 1024,
            isRotated: false
          }
        }]
      });
    };
    window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded);
  </script>
</head>
<body>
  <a-scene
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    xrweb="disableWorldTracking: true">

    <a-assets timeout="120000">
      <img id="layer-iris" src="assets/layers/iris.png" crossorigin="anonymous">
      <img id="layer-rosebuds" src="assets/layers/rosebuds.png" crossorigin="anonymous">
      <img id="layer-rose-white" src="assets/layers/rose-white.png" crossorigin="anonymous">
      <img id="layer-marigold" src="assets/layers/marigold.png" crossorigin="anonymous">
      <img id="layer-rose-pink" src="assets/layers/rose-pink.png" crossorigin="anonymous">
      <img id="layer-hydrangea" src="assets/layers/hydrangea.png" crossorigin="anonymous">
      <img id="layer-poppy" src="assets/layers/poppy.png" crossorigin="anonymous">
      <img id="layer-tulip" src="assets/layers/tulip.png" crossorigin="anonymous">
      <img id="layer-butterfly" src="assets/layers/butterfly.png" crossorigin="anonymous">
      <img id="layer-sunflower" src="assets/layers/sunflower.png" crossorigin="anonymous">
    </a-assets>

    <a-camera position="0 4 10"></a-camera>

    <xrextras-named-image-target name="painting">
      <a-entity painting-resurrection="config: assets/meta/layers.json"></a-entity>
    </xrextras-named-image-target>

  </a-scene>
</body>
</html>
