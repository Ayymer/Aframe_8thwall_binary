<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painting AR — Ruysch Resurrection</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #video-pool {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      pointer-events: none;
      z-index: 1;
    }
    #video-pool.debug {
      left: 8px;
      bottom: 8px;
      width: auto;
      height: auto;
      opacity: 1;
      z-index: 10000;
    }
    #video-pool.debug video {
      width: 80px;
      height: 100px;
      object-fit: cover;
      margin-right: 4px;
      background: #222;
      outline: 1px solid #444;
    }
    #scan-hud {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 9998;
      color: #fff;
      font-size: 13px;
      line-height: 1.4;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 12px;
      border-radius: 8px;
      pointer-events: none;
    }
    #scan-hud .status { font-weight: 600; }
    #scan-hud .detail { opacity: 0.85; font-size: 11px; margin-top: 2px; word-break: break-word; }
  </style>

  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  <script src="js/painting-resurrection.js"></script>
  <script async src="engine/xr.js" data-preload-chunks="slam"></script>

  <script>
    const onxrloaded = () => {
      XR8.XrController.configure({
        imageTargetData: [{
          name: 'painting',
          type: 'PLANAR',
          imagePath: 'assets/Targets/painting.png',
          properties: {
            left: 0, top: 0,
            width: 809, height: 1024,
            originalWidth: 809, originalHeight: 1024,
            isRotated: false
          }
        }]
      });
    };
    window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded);
  </script>
</head>
<body>
  <div id="video-pool" aria-hidden="true">
    <!-- WebM first: Arc/Chrome. MP4 fallback: Safari and older browsers. -->
    <video id="video-flower-1" loop muted playsinline webkit-playsinline preload="metadata">
      <source src="assets/video/flower-1.webm" type="video/webm">
      <source src="assets/video/flower-1.mp4" type="video/mp4">
    </video>
    <video id="video-flower-2" loop muted playsinline webkit-playsinline preload="metadata">
      <source src="assets/video/flower-2.webm" type="video/webm">
      <source src="assets/video/flower-2.mp4" type="video/mp4">
    </video>
    <video id="video-flower-3" loop muted playsinline webkit-playsinline preload="metadata">
      <source src="assets/video/flower-3.webm" type="video/webm">
      <source src="assets/video/flower-3.mp4" type="video/mp4">
    </video>
    <video id="video-flower-4" loop muted playsinline webkit-playsinline preload="metadata">
      <source src="assets/video/flower-4.webm" type="video/webm">
      <source src="assets/video/flower-4.mp4" type="video/mp4">
    </video>
    <video id="video-flower-5" loop muted playsinline webkit-playsinline preload="metadata">
      <source src="assets/video/flower-5.webm" type="video/webm">
      <source src="assets/video/flower-5.mp4" type="video/mp4">
    </video>
    <video id="video-flower-6" loop muted playsinline webkit-playsinline preload="metadata">
      <source src="assets/video/flower-6.webm" type="video/webm">
      <source src="assets/video/flower-6.mp4" type="video/mp4">
    </video>
    <video id="video-flower-7" loop muted playsinline webkit-playsinline preload="metadata">
      <source src="assets/video/flower-7.webm" type="video/webm">
      <source src="assets/video/flower-7.mp4" type="video/mp4">
    </video>
  </div>

  <div id="scan-hud">
    <div class="status">Loading…</div>
    <div class="detail">Initializing</div>
  </div>

  <script>
    // Priming: the FIRST user gesture (which on 8th Wall is the "Begin AR" tap)
    // must call .play() on each <video> so iOS Safari permits later WebGL
    // VideoTexture decoding. We attach a capture-phase listener on document so
    // we run BEFORE 8th Wall's own handler, then let the event continue so its
    // Begin button still works and camera starts normally.
    (function () {
      const pool = document.getElementById('video-pool');
      const debug = /(?:^|[?&])debug=1(?:&|$)/.test(window.location.search);
      if (debug) pool.classList.add('debug');

      const videos = Array.from(pool.querySelectorAll('video'));

      window.flowerVideoStats = {
        primed: 0,
        failed: 0,
        total: videos.length,
        errors: {},
        tapped: false,
      };

      const prime = () => {
        if (window.flowerVideoStats.tapped) return;
        window.flowerVideoStats.tapped = true;

        videos.forEach((v) => {
          v.muted = true;
          v.playsInline = true;
          v.loop = true;
          // Bump preload so the bytes actually start streaming after gesture.
          try { v.preload = 'auto'; } catch (e) {}
          v.load();
          const attempt = v.play();
          if (attempt && attempt.then) {
            attempt.then(() => {
              window.flowerVideoStats.primed++;
              window.dispatchEvent(new CustomEvent('flower-video-primed', {
                detail: { id: v.id }
              }));
            }).catch((err) => {
              window.flowerVideoStats.failed++;
              window.flowerVideoStats.errors[v.id] = err && err.name;
              console.warn('[prime]', v.id, err && err.message);
            });
          } else {
            window.flowerVideoStats.primed++;
          }
        });
      };

      // Capture phase so we always fire before any other handler swallows it.
      document.addEventListener('touchend', prime, { capture: true, once: true });
      document.addEventListener('click', prime, { capture: true, once: true });
      document.addEventListener('pointerup', prime, { capture: true, once: true });
    })();
  </script>

  <a-scene
    scan-hud
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    xrweb="disableWorldTracking: true">

    <a-camera position="0 4 10"></a-camera>

    <xrextras-named-image-target name="painting">
      <a-entity painting-resurrection="config: assets/meta/video-layers.json"></a-entity>
    </xrextras-named-image-target>

  </a-scene>
</body>
</html>
