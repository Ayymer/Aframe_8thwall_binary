<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painting AR — Ruysch Resurrection</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>

  <!-- AR Libraries -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  <script src="js/painting-resurrection.js"></script>

  <!-- 8th Wall Engine -->
  <script async src="engine/xr.js" data-preload-chunks="slam"></script>

  <!-- Image Target Configuration -->
  <script>
    const onxrloaded = () => {
      XR8.XrController.configure({
        imageTargetData: [{
          name: 'painting',
          type: 'PLANAR',
          imagePath: 'assets/Targets/painting.png',
          properties: {
            left: 0,
            top: 0,
            width: 809,
            height: 1024,
            originalWidth: 809,
            originalHeight: 1024,
            isRotated: false
          }
        }]
      });
    };
    window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded);
  </script>
</head>
<body>
  <a-scene
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    xrweb="disableWorldTracking: true">

    <a-assets timeout="120000">
      <video id="video-flower-1" crossorigin="anonymous" loop muted playsinline webkit-playsinline preload="auto">
        <source src="assets/video/flower-1.mp4" type="video/mp4">
        <source src="assets/video/flower-1.webm" type="video/webm">
      </video>
      <video id="video-flower-2" crossorigin="anonymous" loop muted playsinline webkit-playsinline preload="auto">
        <source src="assets/video/flower-2.mp4" type="video/mp4">
        <source src="assets/video/flower-2.webm" type="video/webm">
      </video>
      <video id="video-flower-3" crossorigin="anonymous" loop muted playsinline webkit-playsinline preload="auto">
        <source src="assets/video/flower-3.mp4" type="video/mp4">
        <source src="assets/video/flower-3.webm" type="video/webm">
      </video>
      <video id="video-flower-4" crossorigin="anonymous" loop muted playsinline webkit-playsinline preload="auto">
        <source src="assets/video/flower-4.mp4" type="video/mp4">
        <source src="assets/video/flower-4.webm" type="video/webm">
      </video>
      <video id="video-flower-5" crossorigin="anonymous" loop muted playsinline webkit-playsinline preload="auto">
        <source src="assets/video/flower-5.mp4" type="video/mp4">
        <source src="assets/video/flower-5.webm" type="video/webm">
      </video>
      <video id="video-flower-6" crossorigin="anonymous" loop muted playsinline webkit-playsinline preload="auto">
        <source src="assets/video/flower-6.mp4" type="video/mp4">
        <source src="assets/video/flower-6.webm" type="video/webm">
      </video>
      <video id="video-flower-7" crossorigin="anonymous" loop muted playsinline webkit-playsinline preload="auto">
        <source src="assets/video/flower-7.mp4" type="video/mp4">
        <source src="assets/video/flower-7.webm" type="video/webm">
      </video>
    </a-assets>

    <a-camera position="0 4 10"></a-camera>

    <xrextras-named-image-target name="painting">
      <a-entity painting-resurrection="config: assets/meta/video-layers.json"></a-entity>
    </xrextras-named-image-target>

  </a-scene>
</body>
</html>
